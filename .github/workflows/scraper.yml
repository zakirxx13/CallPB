name: Inspect Toffee Requests

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    name: Inspect Toffee Watch Page
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run request inspector
        run: |
          echo "=========================================="
          echo "Starting Toffee request inspection"
          echo "=========================================="

          python inspect_headers.py

      - name: Save inspection output
        if: always()
        run: |
          mkdir -p debug

          # If the Python script already created an output file,
          # keep it. Otherwise GitHub Actions console logs can
          # still be inspected from the workflow run.
          echo "Inspection completed at $(date -u)" \
            > debug/inspection_run.txt

      - name: Show debug files
        if: always()
        run: |
          echo "=========================================="
          echo "DEBUG FILES"
          echo "=========================================="

          find debug -type f -maxdepth 2 -print 2>/dev/null || true

      - name: Commit debug result
        if: always()
        run: |
          git add debug/

          if git diff --cached --quiet; then
            echo "No debug files changed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git commit -m "Update Toffee request inspection"
            git push
          fi
