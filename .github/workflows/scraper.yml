name: Inspect Toffee Requests

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    name: Inspect Toffee Watch Page
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run inspector
        run: |
          echo "======================================"
          echo "Starting Toffee inspection"
          echo "======================================"

          python inspect_headers.py

      - name: Verify output
        if: always()
        run: |
          echo "======================================"
          echo "OUTPUT FILE"
          echo "======================================"

          if [ -f debug/toffee_requests.json ]; then
            echo "Output file created successfully."
            ls -lh debug/toffee_requests.json

            echo ""
            echo "M3U8 summary:"
            python - <<'PY'
          import json

          with open(
              "debug/toffee_requests.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(
              "Total requests:",
              data.get("total_requests", 0)
          )

          print(
              "M3U8 requests:",
              data.get("m3u8_request_count", 0)
          )

          for item in data.get(
              "m3u8_requests",
              []
          ):
              print(
                  item.get("url", "")
              )
          PY

          else
            echo "ERROR: Output file was not created."
            exit 1
          fi

      - name: Commit output
        if: always()
        run: |
          git add debug/toffee_requests.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git commit \
              -m "Update Toffee request inspection"

            git push

            echo "Output committed and pushed successfully."
          fi

      - name: Final status
        if: always()
        run: |
          echo "======================================"
          echo "Workflow finished"
          echo "======================================"

          if [ -f debug/toffee_requests.json ]; then
            echo "File: debug/toffee_requests.json"
            echo "Status: CREATED"
          else
            echo "Status: FILE NOT FOUND"
          fi
