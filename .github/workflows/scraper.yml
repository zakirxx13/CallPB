name: Check Toffee Playback

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-playback:
    name: Check Playback API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Check Playback API
        run: |
          echo "======================================"
          echo "Checking Toffee playback API..."
          echo "======================================"

          python check_playback.py

      - name: Show result
        if: always()
        run: |
          echo "======================================"
          echo "Playback check result"
          echo "======================================"

          if [ -f debug/playback_check.json ]; then
            cat debug/playback_check.json
          else
            echo "playback_check.json not found"
          fi

      - name: Check changes
        id: changes
        run: |
          git add debug/playback_check.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
          fi

      - name: Commit result
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git commit -m "Check Toffee playback API"

      - name: Push result
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push
